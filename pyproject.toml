[tool.poetry]
name = "aw-watcher-window-cosmic"
version = "0.1.0"
description = "Window watcher for ActivityWatch on the COSMIC desktop environment"
authors = ["Marc Durepos <marc@bemade.org>"]
license = "MPL-2.0"
readme = "README.md"

[tool.poetry.scripts]
aw-watcher-window-cosmic = "aw_watcher_window_cosmic:main"

[tool.poetry.dependencies]
python = "^3.8"
aw-client = "^0.5.14"

[tool.poetry.dev-dependencies]
pytest = "*"
mypy = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
