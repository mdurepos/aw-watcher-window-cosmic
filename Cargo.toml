[package]
name = "aw-watcher-window-cosmic-helper"
version = "0.1.0"
edition = "2021"
authors = ["Marc Durepos <marc@bemade.org>"]
license = "MPL-2.0"
description = "Rust helper for aw-watcher-window-cosmic - window tracking for COSMIC desktop"
repository = "https://github.com/ActivityWatch/aw-watcher-window-cosmic"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "unstable", "staging"] }
cosmic-protocols = { version = "0.2", features = ["client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
